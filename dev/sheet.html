<!doctype html><meta charset=utf-8><title>sheet</title>
<link rel=stylesheet href="../css/style.css">
<style>
body{font:11px sans-serif;margin:4px}
.g{display:grid;grid-template-columns:repeat(6,1fr);gap:2px}
.c{border:1px solid var(--line)}svg.fig{width:100%;display:block;background:var(--bg)}
</style><div class=g id=g></div>
<script type=module>
// Contact sheet: every pose x level, straight from poses/<id>.json. ?p=id,id  ?l=0|1|2  ?c=cols  ?a=1 (alt frame)  ?s=1 (start frame)
import { Renderer2D, fitView } from '../js/figure2d.js';
import { fullFrame, overlay } from '../js/rig.js';
const q = new URLSearchParams(location.search);
const lv = q.get('l') ? [+q.get('l')] : [0, 1, 2];
const only = q.get('p'); const g = document.getElementById('g');
if (q.get('c')) g.style.gridTemplateColumns = `repeat(${q.get('c')},1fr)`;
const idx = await (await fetch('../poses/index.json')).json();
let n = 0;
for (const id of idx) {
  if (only && !only.split(',').includes(id)) continue;
  const spec = await (await fetch(`../poses/${id}.json`)).json();
  for (const l of lv) {
    const lvl = spec.levels[l];
    const d = document.createElement('div'); d.className = 'c';
    d.innerHTML = `<div>${id} L${l}</div><svg class=fig></svg>`; g.append(d);
    try {
      const hold = q.get('s') ? spec.start : q.get('a') && lvl.alt ? overlay(lvl.hold, lvl.alt) : lvl.hold;
      const cam = lvl.camera || spec.camera;
      const view = fitView([hold], cam);
      new Renderer2D(d.querySelector('svg')).draw(hold, { props: q.get('s') ? [] : lvl.props, view });
    } catch (e) { d.append(e.message); console.error(id, e); }
  }
  n++;
}
window.DONE = n;
</script>
